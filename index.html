<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <title>VulnTracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>VulnTracker</h1>

  <!-- i badge sono generati da renderStatistiche() a partire da statistiche -->
  <div id="statistiche">
    <div class="stat-gruppo">
      <span class="stat-titolo">Severità</span>
      <span id="statSeverita"></span>
    </div>
    <div class="stat-gruppo">
      <span class="stat-titolo">Stato</span>
      <span id="statStato"></span>
    </div>
  </div>

  <div id="controlli">
    <label for="filtroSeverita">Severità</label>
    <!-- le opzioni sono popolate da app.js a partire da SEVERITA e STATI -->
    <select id="filtroSeverita"></select>

    <label for="filtroStato">Stato</label>
    <select id="filtroStato"></select>

    <label for="ordinamento">Ordina</label>
    <select id="ordinamento">
      <option value="">Ordine di inserimento</option>
      <option value="sev-desc">Severità: Critical → Low</option>
      <option value="sev-asc">Severità: Low → Critical</option>
    </select>

    <label for="filtro">filtro</label>
    <input type="text" id="filtro" placeholder="cerca vulnerabilità:">

    <button type="button" id="azzeraFiltri">Azzera</button>
    <span id="contatore"></span>
  </div>

  <form id="formVulnerabilita" onsubmit="pushVul(); return false;">
  <table id="form">
    <tbody>
    <tr>
      <td>id</td>
      <td><input type="text" id="vul_id" value="" hidden></td>
    </tr>
    <tr>
      <td>nome</td>
      <td><input type="text" id="vul_name" value=""></td>
    </tr>
    <tr>
      <td>severita</td>
      <td colspan="2">
        <div class="sevbtn">
          <label class="btn-sev low">
            <input type="radio" name="severita" value="Low"> Low
          </label>
          <label class="btn-sev medium">
            <input type="radio" name="severita" value="Medium"> Medium
          </label>
          <label class="btn-sev high">
            <input type="radio" name="severita" value="High"> High
          </label>
          <label class="btn-sev critical">
            <input type="radio" name="severita" value="Critical"> Critical
          </label>
        </div>
      </td>
    </tr>
    <tr>
      <td>sistema</td>
      <td><input type="text" id="vul_sys" value=""></td>
    </tr>
    <tr>
      <td>descrizione</td>
      <td><input type="text" id="vul_desc" value=""></td>
    </tr>
    <tr>
      <td>stato</td>
      <td colspan="2">
        <div class="sttbtn">
          <label class="btn-sev Open">
            <input type="radio" name="stato" value="Open"> Open
          </label>
          <label class="btn-sev InProgress">
            <input type="radio" name="stato" value="In Progress"> In Progress
          </label>
          <label class="btn-sev Closed">
            <input type="radio" name="stato" value="Closed"> Closed
          </label>
        </div>
      </td>
    </tr>

    <tr>
      <td>data</td>
      <td colspan="2">
        <input type="date" id="vul_date" name="data">
      </td>
    </tr>
    <tr>
      <td>azioni</td>
      <td><button type="submit">Aggiungi</button></td>
    </tr>
    </tbody>
  </table>
  </form>
  <table id="vulnList">
    <thead>
      <tr>
        <th>nome</th>
        <th>severita</th>
        <th>sistema</th>
        <th>stato</th>
        <th>descrizione</th>
        <th>data</th>
        <th>azioni</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="app.js"></script>
</body>

</html>
